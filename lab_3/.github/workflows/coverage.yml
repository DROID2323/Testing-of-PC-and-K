# Якщо lab_3 — це корінь репозиторію, файл працює як є.
# Якщо lab_3 — підпапка, перенесіть .github/ у корінь і змініть working-directory на lab_3/03_coverage.
name: coverage
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install coverage pytest pytest-cov
      - run: pytest --cov=app --cov=validation --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: 03_coverage/coverage.xml

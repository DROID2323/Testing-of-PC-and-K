[tool.poetry]
name = "lab-3-coverage"
version = "0.1.0"
description = "Лабораторна робота — Покриття коду (coverage.py, pytest-cov)"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
coverage = "^7.0"
pytest-cov = "^5.0"

[tool.pytest.ini_options]
testpaths = ["03_coverage"]
python_files = ["test_*.py"]
markers = [
    "unit: швидкі юніт-тести",
    "slow: повільні тести",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

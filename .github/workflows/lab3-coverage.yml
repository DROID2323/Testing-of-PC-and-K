name: lab3-coverage
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab_3/03_coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install coverage pytest pytest-cov
      - run: pytest --cov=app --cov=validation --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: lab_3/03_coverage/coverage.xml
